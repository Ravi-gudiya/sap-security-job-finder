name: Naukri Auto Update & Apply

on:
  schedule:
    # 2:30 AM UTC = 8:00 AM IST
    - cron: '30 2 * * *'
    # 3:30 AM UTC = 9:00 AM IST
    - cron: '30 3 * * *'
    # 8:30 AM UTC = 2:00 PM IST
    - cron: '30 8 * * *'
    # 11:30 AM UTC = 5:00 PM IST
    - cron: '30 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Permissions required to commit and push the updated cookies/session state
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Naukri Automation Bot
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          # xvfb-run starts a virtual display buffer so Chromium can run in headed mode (headless=False)
          # which is required to bypass Naukri's bot detection.
          xvfb-run python naukri_bot.py --run --limit 20

      - name: Commit & Push Updated Session State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add naukri_state.json
          
          # Only commit and push if there are modified files in naukri_state.json
          if [ -n "$(git status --porcelain naukri_state.json)" ]; then
            git commit -m "Sync Naukri session cookies [skip ci]"
            git push
          else
            echo "No session changes detected."
          fi
